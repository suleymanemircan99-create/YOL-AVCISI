<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Çoklu Oyun Platformu</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #1a1a2e;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 800px;
        }

        h1 {
            margin-bottom: 20px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.3);
        }

        .screen {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Grid Yapısı */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .card {
            background-color: #16213e;
            border: 2px solid #0f3460;
            border-radius: 10px;
            padding: 30px 15px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .card:hover {
            transform: scale(1.05);
            border-color: #e94560;
            background-color: #0f3460;
            box-shadow: 0 5px 15px rgba(233, 69, 96, 0.4);
        }

        /* Giriş ve Butonlar */
        input[type="text"] {
            padding: 12px 20px;
            font-size: 1.1rem;
            border: 2px solid #0f3460;
            border-radius: 5px;
            background: #16213e;
            color: white;
            width: 80%;
            max-width: 300px;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
        }
        
        input[type="text"]:focus {
            border-color: #e94560;
        }

        .btn {
            background-color: #e94560;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 5px;
            margin: 8px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            font-weight: bold;
        }

        .btn:hover { background-color: #ff6b81; }
        .btn:active { transform: scale(0.95); }
        .back-btn { background-color: #555; }
        .back-btn:hover { background-color: #777; }

        /* Profil Kartı */
        .profile-bar {
            background: #16213e;
            padding: 10px 20px;
            border-radius: 30px;
            display: inline-flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            border: 1px solid #0f3460;
            font-size: 0.9rem;
        }

        /* Oyun Canvas ve Alanları */
        canvas {
            background: #000;
            border: 4px solid #0f3460;
            border-radius: 8px;
            display: block;
            margin: 15px auto;
            max-width: 100%;
        }

        .board {
            display: grid;
            margin: 20px auto;
            gap: 5px;
            background: #0f3460;
            padding: 5px;
            border-radius: 8px;
            width: max-content;
        }

        .cell {
            background: #16213e;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: bold;
            cursor: pointer;
            width: 80px;
            height: 80px;
            transition: background 0.2s;
        }
        .cell:hover { background: #0f3460; }

        /* Mobil Kontroller */
        .mobile-controls {
            display: none;
            grid-template-areas: 
                ". up ."
                "left . right"
                ". down .";
            gap: 10px;
            width: 160px;
            margin: 15px auto;
        }
        .mobile-btn {
            width: 50px;
            height: 50px;
            background: #e94560;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
        }

        #score-board {
            font-size: 1.2rem;
            margin: 10px 0;
            color: #4ecca3;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!-- ================= EKRAN 0: GİRİŞ / İSİM SORMA ================= -->
        <div id="login-screen" class="screen active">
            <h1>🎮 Oyun Dünyasına Hoş Geldin</h1>
            <p style="margin-bottom: 20px; color: #bbb;">Devam etmek için bir oyuncu adı girin:</p>
            <input type="text" id="username-input" placeholder="Oyuncu Adı..." maxlength="15"><br>
            <button class="btn" onclick="login()">Giriş Yap / Başla</button>
        </div>

        <!-- Üst Bar (Giriş yaptıktan sonra görünecek) -->
        <div id="global-profile" style="display: none; text-align: center;">
            <div class="profile-bar">
                <span>👤 Oyuncu: <strong id="player-name-display" style="color: #e94560;">-</strong></span>
                <span id="player-highscores"></span>
                <span style="cursor:pointer; color:#bbb;" onclick="logout()">[Çıkış]</span>
            </div>
        </div>

        <!-- ================= EKRAN 1: OYUN SEÇİMİ ================= -->
        <div id="game-select-screen" class="screen">
            <h1>Oyununu Seç</h1>
            <div class="grid">
                <div class="card" onclick="selectGame('Yılan Oyunu')">🐍 Yılan Oyunu</div>
                <div class="card" onclick="selectGame('XOX Oyunu')">❌ XOX Oyunu</div>
                <div class="card" onclick="selectGame('Tuğla Kırma')">🧱 Tuğla Kırma</div>
                <div class="card" onclick="selectGame('SOS Oyunu')">🆘 SOS Oyunu</div>
                <div class="card" onclick="selectGame('Araba Oyunu')">🏎️ Araba Oyunu</div>
                <div class="card" onclick="selectGame('Labirent Oyunu')">🧩 Labirent Oyunu</div>
            </div>
        </div>

        <!-- ================= EKRAN 2: CİHAZ SEÇİMİ ================= -->
        <div id="device-select-screen" class="screen">
            <h1 id="selected-game-title">Oyun Adı</h1>
            <p style="margin-bottom: 20px; color: #bbb;">Lütfen oynamak istediğiniz kontrol şemasını seçin:</p>
            <div>
                <button class="btn" onclick="selectDevice('PC')">🖥️ PC Modu</button>
                <button class="btn" onclick="selectDevice('Mobil')">📱 Mobil Modu</button>
            </div>
            <button class="btn back-btn" onclick="goBack()">⬅️ Geri Dön</button>
        </div>

        <!-- ================= EKRAN 3: OYUN ALANI ================= -->
        <div id="game-play-screen" class="screen">
            <h1 id="playing-game-title">-</h1>
            <div id="score-board">Skor: <span id="current-score">0</span> | En Yüksek: <span id="high-score">0</span></div>
            
            <div id="game-content-area">
                <!-- Dinamik olarak Canvas veya Board yüklenecek -->
            </div>

            <!-- Mobil Yön Tuşları (Gerekli oyunlarda JavaScript ile açılacak) -->
            <div id="mobile-pad" class="mobile-controls">
                <button class="mobile-btn" style="grid-area: up" id="m-up">▲</button>
                <button class="mobile-btn" style="grid-area: left" id="m-left">◀</button>
                <button class="mobile-btn" style="grid-area: right" id="m-right">▶</button>
                <button class="mobile-btn" style="grid-area: down" id="m-down">▼</button>
            </div>

            <div style="margin-top: 15px;">
                <button class="btn back-btn" onclick="quitGame()">🏠 Ana Menüye Dön</button>
            </div>
        </div>

    </div>

    <script>
        // --- GLOBAL DEĞİŞKENLER VE KAYIT SİSTEMİ ---
        let currentPlayer = "";
        let chosenGame = "";
        let chosenDevice = "";
        let playerData = {}; // Tüm kullanıcıların verilerini tutacak nesne
        let gameLoopInterval = null;

        // Sayfa yüklendiğinde hafızadaki verileri çek
        if(localStorage.getItem('platform_players')) {
            playerData = JSON.parse(localStorage.getItem('platform_players'));
        }

        function login() {
            let nameInput = document.getElementById('username-input').value.trim();
            if(!nameInput) { alert("Lütfen geçerli bir isim girin!"); return; }
            
            currentPlayer = nameInput.toLowerCase();
            
            // Eğer bu isimde oyuncu yoksa yeni profil oluştur
            if(!playerData[currentPlayer]) {
                playerData[currentPlayer] = {
                    displayName: nameInput,
                    scores: { "Yılan Oyunu": 0, "XOX Oyunu": 0, "Tuğla Kırma": 0, "SOS Oyunu": 0, "Araba Oyunu": 0, "Labirent Oyunu": 0 }
                };
                saveData();
            }

            document.getElementById('player-name-display').innerText = playerData[currentPlayer].displayName;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('global-profile').style.display = 'block';
            showScreen('game-select-screen');
        }

        function logout() {
            currentPlayer = "";
            document.getElementById('global-profile').style.display = 'none';
            document.getElementById('login-screen').style.display = 'block';
            showScreen('login-screen');
        }

        function saveData() {
            localStorage.setItem('platform_players', JSON.stringify(playerData));
        }

        function updateHighScoreDisplay() {
            if(playerData[currentPlayer]) {
                let hs = playerData[currentPlayer].scores[chosenGame] || 0;
                document.getElementById('high-score').innerText = hs;
            }
        }

        function saveNewScore(score) {
            if(score > playerData[currentPlayer].scores[chosenGame]) {
                playerData[currentPlayer].scores[chosenGame] = score;
                saveData();
                updateHighScoreDisplay();
            }
        }

        // --- EKRAN YÖNETİMİ ---
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function selectGame(gameName) {
            chosenGame = gameName;
            document.getElementById('selected-game-title').innerText = gameName;
            showScreen('device-select-screen');
        }

        function selectDevice(deviceType) {
            chosenDevice = deviceType;
            document.getElementById('playing-game-title').innerText = chosenGame;
            document.getElementById('current-score').innerText = "0";
            updateHighScoreDisplay();
            
            // Mobil yön butonlarının gösterilme kararı
            let needsPad = ["Yılan Oyunu", "Araba Oyunu", "Labirent Oyunu"].includes(chosenGame);
            document.getElementById('mobile-pad').style.display = (chosenDevice === 'Mobil' && needsPad) ? 'grid' : 'none';

            showScreen('game-play-screen');
            initGameEngine();
        }

        function goBack() {
            showScreen('game-select-screen');
        }

        function quitGame() {
            if(gameLoopInterval) clearInterval(gameLoopInterval);
            document.getElementById('game-content-area').innerHTML = "";
            // Event listener'ları temizlemek için window'u temiz tutuyoruz
            window.onkeydown = null; 
            showScreen('game-select-screen');
        }


        // =================================================================
        // OYUN MOTORLARI ALANI (SOS, XOX, TUĞLA, YILAN, ARABA, LABİRENT)
        // =================================================================

        function initGameEngine() {
            let area = document.getElementById('game-content-area');
            area.innerHTML = ""; // Alanı temizle

            if(chosenGame === "Yılan Oyunu") {
                runSnakeGame(area);
            } else if(chosenGame === "XOX Oyunu") {
                runXOXGame(area);
            } else if(chosenGame === "Tuğla Kırma") {
                runBrickGame(area);
            } else if(chosenGame === "SOS Oyunu") {
                runSOSGame(area);
            } else if(chosenGame === "Araba Oyunu") {
                runCarGame(area);
            } else if(chosenGame === "Labirent Oyunu") {
                runMazeGame(area);
            }
        }

// -----------------------------------------------------------------
// 1. YILAN OYUNU KODLARI (Tam Çözümlü, Gözlüklü ve Eklemli Yılan)
// -----------------------------------------------------------------
function runSnakeGame(target) {
    let startContainer = document.createElement('div');
    startContainer.style.textAlign = "center";
    startContainer.style.marginTop = "50px";
    
    let startBtn = document.createElement('button');
    startBtn.innerText = "▶️ Oyuna Başla";
    startBtn.className = "btn";
    startBtn.style.padding = "15px 40px";
    startBtn.style.fontSize = "1.5rem";
    
    startContainer.appendChild(startBtn);
    target.appendChild(startContainer);

    let canvas = document.createElement('canvas');
    canvas.width = 400; 
    canvas.height = 400;
    canvas.style.display = "none"; 
    target.appendChild(canvas);
    
    let ctx = canvas.getContext('2d');

    let box = 20;
    // Yılanı baştan 3 birim uzunluğunda başlatalım ki tam yılan gibi görünsün
    let snake = [
        {x: 10 * box, y: 10 * box},
        {x: 9 * box, y: 10 * box},
        {x: 8 * box, y: 10 * box}
    ];
    let score = 0;
    let d = "RIGHT";
    let changingDirection = false; 
    
    function generateFood() {
        let newFood;
        let onSnake = true;
        while(onSnake) {
            newFood = { 
                x: Math.floor(Math.random() * 20) * box, 
                y: Math.floor(Math.random() * 20) * box 
            };
            onSnake = snake.some(segment => segment.x === newFood.x && segment.y === newFood.y);
        }
        return newFood;
    }

    let food = generateFood();

    function direction(key) {
        if (changingDirection) return;

        if((key === "LEFT" || key === "ArrowLeft" || key === "a") && d !== "RIGHT") { d = "LEFT"; changingDirection = true; }
        else if((key === "UP" || key === "ArrowUp" || key === "w") && d !== "DOWN") { d = "UP"; changingDirection = true; }
        else if((key === "RIGHT" || key === "ArrowRight" || key === "d") && d !== "LEFT") { d = "RIGHT"; changingDirection = true; }
        else if((key === "DOWN" || key === "ArrowDown" || key === "s") && d !== "UP") { d = "DOWN"; changingDirection = true; }
    }

    startBtn.onclick = () => {
        startContainer.style.display = "none"; 
        canvas.style.display = "block"; 
        
        window.onkeydown = (e) => direction(e.key);
        document.getElementById('m-up').onclick = () => direction("UP");
        document.getElementById('m-down').onclick = () => direction("DOWN");
        document.getElementById('m-left').onclick = () => direction("LEFT");
        document.getElementById('m-right').onclick = () => direction("RIGHT");

        gameLoopInterval = setInterval(gameLoop, 120);
    };

    function gameLoop() {
        changingDirection = false; 

        // 1. ADIM: Yılanın yeni baş pozisyonunu hesapla
        let snakeX = snake[0].x;
        let snakeY = snake[0].y;

        if(d === "LEFT") snakeX -= box;
        if(d === "UP") snakeY -= box;
        if(d === "RIGHT") snakeX += box;
        if(d === "DOWN") snakeY += box;

        let newHead = { x: snakeX, y: snakeY };

        // 2. ADIM: Yem yeme durumu
        if(snakeX === food.x && snakeY === food.y) {
            score++;
            document.getElementById('current-score').innerText = score;
            saveNewScore(score);
            food = generateFood(); 
        } else {
            snake.pop(); // Yem yenmediyse son parçayı sil ki ilerliyor gibi görünsün
        }

        // 3. ADIM: Çarpışma Kontrolü (Duvarlar ve Kendi gövdesi)
        let isGameOver = false;
        if(snakeX < 0 || snakeY < 0 || snakeX >= canvas.width || snakeY >= canvas.height || collision(newHead, snake)) {
            isGameOver = true;
        }

        // Yeni başı yılana ekle (Çarpmış olsa bile ekliyoruz ki ekranda görelim)
        snake.unshift(newHead);

        // 4. ADIM: Ekrana Çizme İşlemleri
        ctx.fillStyle = "#111"; // Arka plan
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Tavşanı Çiz
        ctx.font = "18px Arial";
        ctx.fillText("🐇", food.x, food.y + 16);

        // Yılanı Çiz
        for(let i = 0; i < snake.length; i++) {
            if (i === 0) {
                // BAŞ KISMI (Daha koyu yeşil)
                ctx.fillStyle = "#1e5f5c";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);

                // Yılanın Yönüne Göre Gözleri Çiz
                ctx.fillStyle = "#fff"; // Göz rengi
                let eSize = 4; // Göz boyutu
                if(d === "RIGHT") {
                    ctx.fillRect(snake[i].x + 12, snake[i].y + 4, eSize, eSize);
                    ctx.fillRect(snake[i].x + 12, snake[i].y + 12, eSize, eSize);
                } else if(d === "LEFT") {
                    ctx.fillRect(snake[i].x + 4, snake[i].y + 4, eSize, eSize);
                    ctx.fillRect(snake[i].x + 4, snake[i].y + 12, eSize, eSize);
                } else if(d === "UP") {
                    ctx.fillRect(snake[i].x + 4, snake[i].y + 4, eSize, eSize);
                    ctx.fillRect(snake[i].x + 12, snake[i].y + 4, eSize, eSize);
                } else if(d === "DOWN") {
                    ctx.fillRect(snake[i].x + 4, snake[i].y + 12, eSize, eSize);
                    ctx.fillRect(snake[i].x + 12, snake[i].y + 12, eSize, eSize);
                }
            } else {
                // GÖVDE KISMI (Parlak yeşil, aralarında 1 piksel boşluk var - eklemli görünüm için)
                ctx.fillStyle = "#4ecca3";
                // Kırmızı renge boyanma (yanma efekti için, eğer oyun bittiyse ve bu parça ilk sıradaysa)
                if(isGameOver && i === 1) ctx.fillStyle = "#e94560"; 
                
                ctx.fillRect(snake[i].x + 1, snake[i].y + 1, box - 2, box - 2);
            }
        }

        // 5. ADIM: Eğer yandıysak, çarpma karesi çizildikten BİRAZ SONRA oyunu durdur
        if (isGameOver) {
            clearInterval(gameLoopInterval);
            // Uyarı penceresi ekranın donmasına sebep olmasın diye setTimeout kullanıyoruz
            setTimeout(() => {
                alert("Oyun Bitti! Tavşan avı sona erdi. Skorunuz: " + score);
                initGameEngine();
            }, 50);
        }
    }

    function collision(head, array) {
        for(let i = 0; i < array.length; i++) {
            if(head.x === array[i].x && head.y === array[i].y) return true;
        }
        return false;
    }
}

// -----------------------------------------------------------------
// 2. XOX (TIC TAC TOE) OYUNU KODLARI (Kalıcı Hafıza ve Skor Sistemi)
// -----------------------------------------------------------------
function runXOXGame(target) {
    target.innerHTML = ""; // Hedef alanı temizle

    // --- 1. KALICI HAFIZA (LOCAL STORAGE) ---
    // Eğer daha önce kaydedilmiş bir veri varsa onu al, yoksa seviye 1 ve skor 0 olarak başlat.
    let memory = JSON.parse(localStorage.getItem('xoxData')) || { level: 1, score: 0 };
    
    let cells = Array(9).fill("");
    let turn = "X"; 
    let gameMode = ""; 
    let isGameOver = false;

    // --- 2. BAŞLANGIÇ EKRANI ---
    let setupContainer = document.createElement('div');
    setupContainer.style.textAlign = "center";
    setupContainer.style.marginTop = "30px";
    
    setupContainer.innerHTML = `
        <h2 style="margin-bottom: 20px; color:#fff;">Oyun Modunu Seçin</h2>
        <button class="btn" id="btn-1p" style="background:#e94560; padding:15px; margin:10px;">🤖 Bilgisayara Karşı</button>
        <br>
        <button class="btn" id="btn-2p" style="background:#4ecca3; padding:15px; margin:10px;">👥 Arkadaşınla Oyna</button>
        <div style="margin-top:20px; color:#aaa; font-size:1rem;">
            Mevcut XOX Seviyeniz: <strong>${memory.level}</strong> | Toplam Skor: <strong>${memory.score}</strong>
        </div>
    `;
    target.appendChild(setupContainer);

    let gameContainer = document.createElement('div');
    gameContainer.style.display = "none";
    gameContainer.style.textAlign = "center";
    
    let infoBar = document.createElement('div');
    infoBar.style.fontSize = "1.2rem";
    infoBar.style.margin = "15px 0";
    infoBar.style.fontWeight = "bold";
    gameContainer.appendChild(infoBar);

    let boardDiv = document.createElement('div');
    boardDiv.className = "board";
    boardDiv.style.gridTemplateColumns = "repeat(3, 1fr)";
    gameContainer.appendChild(boardDiv);

    target.appendChild(gameContainer);

    setupContainer.querySelector('#btn-1p').onclick = () => startGame("1P");
    setupContainer.querySelector('#btn-2p').onclick = () => startGame("2P");

    function startGame(mode) {
        gameMode = mode;
        setupContainer.style.display = "none";
        gameContainer.style.display = "block";
        resetBoard();
    }

    function resetBoard() {
        cells = Array(9).fill("");
        turn = "X";
        isGameOver = false;
        boardDiv.innerHTML = ""; 

        for(let i = 0; i < 9; i++) {
            let cell = document.createElement('div');
            cell.className = "cell";
            cell.dataset.index = i;
            cell.onclick = () => handleCellClick(i);
            boardDiv.appendChild(cell);
        }
        updateInfoBar();
    }

    function updateInfoBar() {
        if(gameMode === "1P") {
            infoBar.innerHTML = `
                <span style="color:#e94560">Sen (X)</span> vs <span style="color:#4ecca3">PC (O)</span> <br> 
                <span style="color:#fff; font-size:1rem;">Seviye: ${memory.level} | Skor: ${memory.score}</span>
            `;
        } else {
            let turnText = turn === "X" ? '<span style="color:#e94560">Sıra: Kırmızı Takım (X)</span>' : '<span style="color:#4ecca3">Sıra: Mavi Takım (O)</span>';
            infoBar.innerHTML = turnText;
        }
    }

    function handleCellClick(index) {
        if(isGameOver || cells[index] !== "") return;
        if(gameMode === "1P" && turn === "O") return; // PC'nin sırasındayken tıklamayı engelle

        makeMove(index, turn);

        if(!isGameOver) {
            turn = turn === "X" ? "O" : "X";
            updateInfoBar();
            
            if(gameMode === "1P" && turn === "O") {
                setTimeout(botMove, 600);
            }
        }
    }

    function makeMove(index, player) {
        cells[index] = player;
        let cellEl = boardDiv.children[index];
        cellEl.innerText = player;
        cellEl.style.color = player === "X" ? "#e94560" : "#4ecca3";
        checkGameState();
    }

    // --- YAPAY ZEKA ---
    function botMove() {
        if(isGameOver) return;
        let emptyCells = cells.map((c, i) => c === "" ? i : null).filter(v => v !== null);
        if(emptyCells.length === 0) return;

        let chosenIndex = -1;
        // Seviyeye göre zeka oranı (Kalıcı hafızadan çekilir)
        let intelligenceChance = Math.min(memory.level * 0.25, 1.0); 

        if (Math.random() < intelligenceChance) {
            chosenIndex = getSmartMove();
        }

        if (chosenIndex === -1) {
            chosenIndex = emptyCells[Math.floor(Math.random() * emptyCells.length)];
        }

        makeMove(chosenIndex, "O");
        
        if(!isGameOver) {
            turn = "X";
            updateInfoBar();
        }
    }

    function getSmartMove() {
        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8], 
            [0,3,6], [1,4,7], [2,5,8], 
            [0,4,8], [2,4,6]           
        ];

        // Kazanma kontrolü
        for (let p of winPatterns) {
            if (cells[p[0]] === "O" && cells[p[1]] === "O" && cells[p[2]] === "") return p[2];
            if (cells[p[0]] === "O" && cells[p[2]] === "O" && cells[p[1]] === "") return p[1];
            if (cells[p[1]] === "O" && cells[p[2]] === "O" && cells[p[0]] === "") return p[0];
        }

        // Savunma kontrolü
        for (let p of winPatterns) {
            if (cells[p[0]] === "X" && cells[p[1]] === "X" && cells[p[2]] === "") return p[2];
            if (cells[p[0]] === "X" && cells[p[2]] === "X" && cells[p[1]] === "") return p[1];
            if (cells[p[1]] === "X" && cells[p[2]] === "X" && cells[p[0]] === "") return p[0];
        }

        if (cells[4] === "") return 4;
        return -1;
    }

    // --- KAZANMA, KAYBETME VE HAFIZAYA KAYDETME ---
    function checkGameState() {
        const winPatterns = [
            [0,1,2], [3,4,5], [6,7,8],
            [0,3,6], [1,4,7], [2,5,8],
            [0,4,8], [2,4,6]
        ];

        let winner = null;

        for (let p of winPatterns) {
            if (cells[p[0]] !== "" && cells[p[0]] === cells[p[1]] && cells[p[1]] === cells[p[2]]) {
                winner = cells[p[0]];
                boardDiv.children[p[0]].style.background = "#1f4068";
                boardDiv.children[p[1]].style.background = "#1f4068";
                boardDiv.children[p[2]].style.background = "#1f4068";
                break;
            }
        }

        if (winner) {
            isGameOver = true;
            setTimeout(() => {
                if (gameMode === "1P") {
                    if (winner === "X") {
                        // KAZANMA DURUMU: Skor ve Seviye artırılır, localStorage'a kaydedilir
                        memory.level++;
                        memory.score += 50;
                        localStorage.setItem('xoxData', JSON.stringify(memory));
                        
                        alert(`Kazandınız! Kırmızı Takım galip. 🎉 \n+50 Puan!\nYeni Seviye: ${memory.level}\nToplam Skor: ${memory.score}`);
                    } else {
                        // KAYBETME DURUMU: Oyuncu seviye düşmez, tekrar dener
                        alert(`Kaybettiniz! Mavi Takım (PC) Kazandı. 🤖\nKaldığınız Seviye: ${memory.level}`);
                    }
                } else {
                    let team = winner === "X" ? "Kırmızı Takım" : "Mavi Takım";
                    alert(`Oyun Bitti! ${team} Kazandı! 🏆`);
                }
                resetBoard();
            }, 300);
            return;
        }

        if (cells.every(c => c !== "")) {
            isGameOver = true;
            setTimeout(() => {
                alert("Oyun Berabere! Kimse Kazanamadı. 🤝");
                resetBoard(); 
            }, 300);
        }
    }
}

// -----------------------------------------------------------------
// 3. TUĞLA KIRMA OYUNU KODLARI (Sıkıcı Alert Pencereleri Kaldırıldı)
// -----------------------------------------------------------------
function runBrickGame(target) {
    target.innerHTML = ""; 

    let memory = JSON.parse(localStorage.getItem('brickData')) || { level: 1, score: 0 };
    let level = memory.level;
    let score = memory.score;

    function saveGameData() {
        localStorage.setItem('brickData', JSON.stringify({ level: level, score: score }));
    }

    let startContainer = document.createElement('div');
    startContainer.style.textAlign = "center";
    startContainer.style.marginTop = "40px";
    
    let startBtn = document.createElement('button');
    startBtn.innerText = "▶️ Oyuna Başla";
    startBtn.className = "btn";
    startBtn.style.padding = "15px 40px";
    startBtn.style.fontSize = "1.5rem";
    
    startContainer.appendChild(startBtn);
    target.appendChild(startContainer);

    let infoBar = document.createElement('div');
    infoBar.style.fontSize = "1.2rem";
    infoBar.style.margin = "10px 0";
    infoBar.style.fontWeight = "bold";
    infoBar.style.color = "#4ecca3";
    infoBar.style.display = "none";
    target.appendChild(infoBar);

    let canvas = document.createElement('canvas');
    canvas.width = 480; 
    canvas.height = 320;
    canvas.style.display = "none";
    target.appendChild(canvas);
    
    let ctx = canvas.getContext('2d');

    let isGameOver = false;
    let isTransitioning = false;
    let gameLoopInterval;
    
    let ballRadius, paddleWidth, paddleHeight, brickWidth, brickHeight;
    let brickRowCount, brickColumnCount;
    let brickPadding = 5; 
    let brickOffsetTop = 40; 
    let brickOffsetLeft = 10;

    let x, y, dx, dy, baseSpeed;
    let paddleX, rightPressed = false, leftPressed = false, lastPaddleX = 0;
    let bricks = [];

    function initLevel() {
        let scale = Math.max(0.5, 1 - (level * 0.05)); 

        brickRowCount = Math.min(2 + level, 7); 
        brickColumnCount = Math.min(6 + Math.floor(level / 2), 12); 

        let totalPadding = (brickColumnCount - 1) * brickPadding;
        brickWidth = (canvas.width - (2 * brickOffsetLeft) - totalPadding) / brickColumnCount;
        brickHeight = 15 * scale; 
        
        ballRadius = Math.max(4, 7 * scale);
        paddleWidth = Math.max(40, 70 * scale);
        paddleHeight = 10;

        baseSpeed = 3 + (level * 0.4); 
        x = canvas.width / 2; 
        y = canvas.height - 30;
        dx = baseSpeed * (Math.random() > 0.5 ? 1 : -1); 
        dy = -baseSpeed;
        paddleX = (canvas.width - paddleWidth) / 2;
        lastPaddleX = paddleX;

        bricks = [];
        for(let c = 0; c < brickColumnCount; c++) {
            bricks[c] = [];
            for(let r = 0; r < brickRowCount; r++) {
                let shouldExist = Math.random() > 0.2; 
                bricks[c][r] = { x: 0, y: 0, status: shouldExist ? 1 : 0 };
            }
        }

        infoBar.innerHTML = `Seviye: <span style="color:#fff">${level}</span> | Toplam Skor: <span style="color:#fff">${score}</span>`;
    }

    startBtn.onclick = () => {
        startContainer.style.display = "none";
        infoBar.style.display = "block";
        canvas.style.display = "block";
        
        initLevel();

        window.onkeydown = (e) => {
            if(e.key === "Right" || e.key === "ArrowRight" || e.key === "d") rightPressed = true;
            else if(e.key === "Left" || e.key === "ArrowLeft" || e.key === "a") leftPressed = true;
        };
        window.onkeyup = (e) => {
            if(e.key === "Right" || e.key === "ArrowRight" || e.key === "d") rightPressed = false;
            else if(e.key === "Left" || e.key === "ArrowLeft" || e.key === "a") leftPressed = false;
        };

        canvas.ontouchmove = (e) => {
            let relativeX = e.touches[0].clientX - canvas.getBoundingClientRect().left;
            if(relativeX > 0 && relativeX < canvas.width) {
                paddleX = relativeX - paddleWidth / 2;
            }
        };

        gameLoopInterval = setInterval(draw, 1000/60); 
    };

    function collisionDetection() {
        let activeBricks = 0;
        for(let c = 0; c < brickColumnCount; c++) {
            for(let r = 0; r < brickRowCount; r++) {
                let b = bricks[c][r];
                if(b.status === 1) {
                    activeBricks++;
                    if(x > b.x && x < b.x + brickWidth && y > b.y && y < b.y + brickHeight) {
                        dy = -dy; 
                        b.status = 0; 
                        score += 10; 
                        saveGameData(); 
                        infoBar.innerHTML = `Seviye: <span style="color:#fff">${level}</span> | Toplam Skor: <span style="color:#fff">${score}</span>`;
                    }
                }
            }
        }

        if(activeBricks === 0 && !isTransitioning) {
            isTransitioning = true;
            level++;
            saveGameData(); 
            
            // Alert yerine ekranda bilgi veriyoruz
            infoBar.innerHTML = `<span style="color:#4ecca3">Tebrikler! Seviye ${level} yükleniyor... 🚀</span>`;
            
            setTimeout(() => {
                initLevel();
                isTransitioning = false;
            }, 1500); // 1.5 saniye sonra yeni seviye otomatik başlar
        }
    }

    function drawBall() {
        ctx.beginPath(); 
        ctx.arc(x, y, ballRadius, 0, Math.PI * 2);
        ctx.fillStyle = "#e94560"; 
        ctx.fill(); 
        ctx.closePath();
    }

    function drawPaddle() {
        ctx.beginPath(); 
        ctx.roundRect ? ctx.roundRect(paddleX, canvas.height - paddleHeight - 5, paddleWidth, paddleHeight, 5) : ctx.rect(paddleX, canvas.height - paddleHeight - 5, paddleWidth, paddleHeight);
        ctx.fillStyle = "#4ecca3"; 
        ctx.fill(); 
        ctx.closePath();
    }

    function drawBricks() {
        const colors = ["#ff4757", "#ffa502", "#2ed573", "#1e90ff", "#3742fa", "#ff7f50", "#7bed9f", "#5352ed"];
        for(let c = 0; c < brickColumnCount; c++) {
            for(let r = 0; r < brickRowCount; r++) {
                if(bricks[c][r].status === 1) {
                    let brickX = (c * (brickWidth + brickPadding)) + brickOffsetLeft;
                    let brickY = (r * (brickHeight + brickPadding)) + brickOffsetTop;
                    bricks[c][r].x = brickX; 
                    bricks[c][r].y = brickY;
                    
                    ctx.beginPath(); 
                    ctx.roundRect ? ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 3) : ctx.rect(brickX, brickY, brickWidth, brickHeight);
                    ctx.fillStyle = colors[r % colors.length]; 
                    ctx.fill(); 
                    ctx.closePath();
                }
            }
        }
    }

    function draw() {
        if(isGameOver) return;

        ctx.fillStyle = "#111";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        drawBricks(); 
        drawBall(); 
        drawPaddle(); 
        collisionDetection();

        if(x + dx > canvas.width - ballRadius || x + dx < ballRadius) dx = -dx;
        if(y + dy < ballRadius) dy = -dy;
        
        else if(y + dy > canvas.height - ballRadius - paddleHeight - 5) {
            if(x > paddleX && x < paddleX + paddleWidth) {
                dy = -Math.abs(dy); 

                let paddleDirection = paddleX - lastPaddleX; 
                let hitPoint = x - (paddleX + paddleWidth / 2);
                let normalizedHit = hitPoint / (paddleWidth / 2);

                if (paddleDirection < 0) {
                    dx = -Math.abs(baseSpeed) + (normalizedHit * 0.5); 
                } 
                else if (paddleDirection > 0) {
                    dx = Math.abs(baseSpeed) + (normalizedHit * 0.5); 
                } 
                else {
                    dx = normalizedHit * baseSpeed * 1.5;
                }
            } 
            // --- ALERT KALDIRILDI: YANMA DURUMUNDA AKICI GEÇİŞ ---
            else if (y + dy > canvas.height) {
                isGameOver = true;
                clearInterval(gameLoopInterval);
                
                // Uyarı penceresi (alert) yerine sadece yazıyı değiştiriyoruz
                infoBar.innerHTML = `<span style="color:#e94560">Topu Kaçırdın! Yeniden başlatılıyor...</span>`;
                
                setTimeout(() => {
                    isGameOver = false;
                    initLevel(); // Yazı eski haline burada dönecek
                    gameLoopInterval = setInterval(draw, 1000/60);
                }, 1000); // 1 saniye bekleyip sessizce tekrar başlatır
                return;
            }
        }

        let paddleSpeed = 6 + (level * 0.3);
        if(rightPressed && paddleX < canvas.width - paddleWidth) paddleX += paddleSpeed;
        else if(leftPressed && paddleX > 0) paddleX -= paddleSpeed;

        x += dx; 
        y += dy;
        lastPaddleX = paddleX;
    }
}

// -----------------------------------------------------------------
// 2. SOS OYUNU (9x9 BÜYÜK HARİTA, Gerçek SOS Kuralları)
// -----------------------------------------------------------------
function runSOSGame(target) {
    target.innerHTML = ""; 

    let memory = JSON.parse(localStorage.getItem('sosData')) || { level: 1, score: 0 };
    
    const gridSize = 9; // 9x9 Tahta boyutu
    const totalCells = gridSize * gridSize; // 81 Kare
    
    let cells = Array(totalCells).fill("");
    let scoredLines = [];
    let turn = "P1"; 
    let gameMode = ""; 
    let isGameOver = false;
    
    let matchScoreP1 = 0;
    let matchScoreP2 = 0;
    let currentLetter = "S"; 

    // --- 9x9 KAZANMA KOMBİNASYONLARINI OTOMATİK HESAPLAMA ---
    let winPatterns = [];
    for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
            // Yatay (Sağa doğru 3'lü sığabiliyorsa)
            if (c <= gridSize - 3) winPatterns.push([r*gridSize+c, r*gridSize+(c+1), r*gridSize+(c+2)]);
            // Dikey (Aşağı doğru 3'lü sığabiliyorsa)
            if (r <= gridSize - 3) winPatterns.push([r*gridSize+c, (r+1)*gridSize+c, (r+2)*gridSize+c]);
            // Çapraz (Sağ Aşağı doğru)
            if (r <= gridSize - 3 && c <= gridSize - 3) winPatterns.push([r*gridSize+c, (r+1)*gridSize+(c+1), (r+2)*gridSize+(c+2)]);
            // Çapraz (Sol Aşağı doğru)
            if (r <= gridSize - 3 && c >= 2) winPatterns.push([r*gridSize+c, (r+1)*gridSize+(c-1), (r+2)*gridSize+(c-2)]);
        }
    }

    // --- BAŞLANGIÇ EKRANI ---
    let setupContainer = document.createElement('div');
    setupContainer.style.textAlign = "center";
    setupContainer.style.marginTop = "30px";
    
    setupContainer.innerHTML = `
        <h2 style="margin-bottom: 20px; color:#fff;">Büyük Harita SOS (9x9)</h2>
        <button class="btn" id="btn-1p" style="background:#e94560; padding:15px; margin:10px;">🤖 Bilgisayara Karşı</button>
        <br>
        <button class="btn" id="btn-2p" style="background:#4ecca3; padding:15px; margin:10px;">👥 Arkadaşınla Oyna</button>
        <div style="margin-top:20px; color:#aaa; font-size:1rem;">
            Kariyer Seviyeniz: <strong>${memory.level}</strong> | Toplam Skor: <strong>${memory.score}</strong>
        </div>
    `;
    target.appendChild(setupContainer);

    // --- OYUN ALANI ---
    let gameContainer = document.createElement('div');
    gameContainer.style.display = "none";
    gameContainer.style.textAlign = "center";
    
    let infoBar = document.createElement('div');
    infoBar.style.margin = "10px 0";
    gameContainer.appendChild(infoBar);

    let letterSelector = document.createElement('div');
    letterSelector.style.marginBottom = "10px";
    letterSelector.innerHTML = `
        <span style="color:#fff; margin-right:10px; font-size:1.1rem;">Harfini Seç:</span>
        <button id="btn-s" class="btn" style="padding:5px 20px; margin-right:5px; font-size:1.2rem; font-weight:bold;">S</button>
        <button id="btn-o" class="btn" style="padding:5px 20px; font-size:1.2rem; font-weight:bold;">O</button>
    `;
    gameContainer.appendChild(letterSelector);

    let boardDiv = document.createElement('div');
    boardDiv.className = "board";
    // 9x9 ızgarayı ayarla, ortala ve sınırlandır
    boardDiv.style.display = "grid";
    boardDiv.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
    boardDiv.style.gap = "2px";
    boardDiv.style.width = "fit-content";
    boardDiv.style.margin = "0 auto";
    boardDiv.style.background = "#222";
    boardDiv.style.border = "3px solid #444";
    boardDiv.style.borderRadius = "8px";
    boardDiv.style.padding = "5px";
    
    gameContainer.appendChild(boardDiv);
    target.appendChild(gameContainer);

    setupContainer.querySelector('#btn-1p').onclick = () => startGame("1P");
    setupContainer.querySelector('#btn-2p').onclick = () => startGame("2P");

    function updateLetterUI() {
        document.getElementById('btn-s').style.background = currentLetter === "S" ? "#e94560" : "#555";
        document.getElementById('btn-o').style.background = currentLetter === "O" ? "#4ecca3" : "#555";
    }

    document.getElementById('btn-s').onclick = () => { currentLetter = "S"; updateLetterUI(); };
    document.getElementById('btn-o').onclick = () => { currentLetter = "O"; updateLetterUI(); };

    function startGame(mode) {
        gameMode = mode;
        setupContainer.style.display = "none";
        gameContainer.style.display = "block";
        resetBoard();
    }

    function resetBoard() {
        cells = Array(totalCells).fill("");
        scoredLines = [];
        matchScoreP1 = 0;
        matchScoreP2 = 0;
        turn = "P1";
        isGameOver = false;
        currentLetter = "S";
        updateLetterUI();
        boardDiv.innerHTML = ""; 

        for(let i = 0; i < totalCells; i++) {
            let cell = document.createElement('div');
            // Hücre boyutlarını 9x9'a göre optimize et
            cell.style.width = "35px";
            cell.style.height = "35px";
            cell.style.background = "#333";
            cell.style.display = "flex";
            cell.style.alignItems = "center";
            cell.style.justifyContent = "center";
            cell.style.fontSize = "1.2rem";
            cell.style.fontWeight = "bold";
            cell.style.cursor = "pointer";
            cell.style.borderRadius = "4px";
            cell.style.transition = "background 0.2s";
            
            cell.dataset.index = i;
            cell.onclick = () => handleCellClick(i);
            boardDiv.appendChild(cell);
        }
        updateInfoBar();
    }

    function updateInfoBar() {
        let turnText = turn === "P1" 
            ? '<span style="color:#e94560">Sıra Sende (Kırmızı)</span>' 
            : '<span style="color:#4ecca3">Sıra ' + (gameMode==="1P" ? 'PC (Mavi)' : 'Rakipte (Mavi)') + '</span>';
        
        infoBar.innerHTML = `
            <div style="font-size:1.2rem; margin-bottom:5px; font-weight:bold;">${turnText}</div>
            <span style="color:#e94560; font-size:1.2rem; font-weight:bold;">Sen: ${matchScoreP1}</span> <span style="color:#fff; font-size:1.2rem;">|</span> 
            <span style="color:#4ecca3; font-size:1.2rem; font-weight:bold;">Rakip: ${matchScoreP2}</span> <br>
            <span style="color:#aaa; font-size:0.9rem;">Kariyer: Seviye ${memory.level} | Skor ${memory.score}</span>
        `;
    }

    function handleCellClick(index) {
        if(isGameOver || cells[index] !== "") return;
        if(gameMode === "1P" && turn === "P2") return; 

        makeMove(index, currentLetter);
    }

    function makeMove(index, letter) {
        cells[index] = letter;
        let cellEl = boardDiv.children[index];
        cellEl.innerText = letter;
        cellEl.style.color = turn === "P1" ? "#e94560" : "#4ecca3";

        let pointsGained = checkSOS();

        if (pointsGained > 0) {
            if(turn === "P1") matchScoreP1 += pointsGained;
            else matchScoreP2 += pointsGained;
            
            updateInfoBar();
            checkGameOver();
            
            if(!isGameOver && gameMode === "1P" && turn === "P2") {
                setTimeout(botMove, 500); // Akıcı olması için bekleme süresi 0.5 saniyeye çekildi
            }
        } else {
            turn = turn === "P1" ? "P2" : "P1"; 
            updateInfoBar();
            checkGameOver();
            
            if(!isGameOver && gameMode === "1P" && turn === "P2") {
                setTimeout(botMove, 500);
            }
        }
    }

    function checkSOS() {
        let points = 0;
        for(let p of winPatterns) {
            if(!scoredLines.includes(p.toString())) {
                if(cells[p[0]] === "S" && cells[p[1]] === "O" && cells[p[2]] === "S") {
                    scoredLines.push(p.toString()); 
                    points++;
                    // Puan alan hücrelerin arkaplanını belirginleştir
                    boardDiv.children[p[0]].style.background = "#1f4068";
                    boardDiv.children[p[1]].style.background = "#1f4068";
                    boardDiv.children[p[2]].style.background = "#1f4068";
                }
            }
        }
        return points;
    }

    // --- YAPAY ZEKA ---
    function botMove() {
        if(isGameOver) return;
        let emptyCells = cells.map((c, i) => c === "" ? i : null).filter(v => v !== null);
        if(emptyCells.length === 0) return;

        let moveFound = false;

        // Bot tüm boş kareleri tarayarak SOS yapıp yapamayacağına bakar
        for(let i of emptyCells) {
            cells[i] = "S";
            if(wouldMakeSOS()) { makeMove(i, "S"); moveFound = true; break; }
            
            cells[i] = "O";
            if(wouldMakeSOS()) { makeMove(i, "O"); moveFound = true; break; }
            
            cells[i] = ""; 
        }

        if(!moveFound) {
            let randomIdx = emptyCells[Math.floor(Math.random() * emptyCells.length)];
            let randomLetter = Math.random() > 0.5 ? "S" : "O";
            makeMove(randomIdx, randomLetter);
        }
    }

    function wouldMakeSOS() {
        for(let p of winPatterns) {
            if(!scoredLines.includes(p.toString())) {
                if(cells[p[0]] === "S" && cells[p[1]] === "O" && cells[p[2]] === "S") {
                    return true;
                }
            }
        }
        return false;
    }

    function checkGameOver() {
        if (cells.every(c => c !== "")) {
            isGameOver = true;
            setTimeout(() => {
                if (matchScoreP1 > matchScoreP2) {
                    memory.level++;
                    memory.score += 50;
                    localStorage.setItem('sosData', JSON.stringify(memory));
                    alert(`Tebrikler, Kazandınız! 🎉 \nMaç Skoru: ${matchScoreP1} - ${matchScoreP2}\n+50 Puan! Yeni Seviye: ${memory.level}`);
                } else if (matchScoreP2 > matchScoreP1) {
                    alert(`Maalesef Kaybettiniz! 🤖\nMaç Skoru: ${matchScoreP2} - ${matchScoreP1}`);
                } else {
                    alert(`Maç Berabere! 🤝\nMaç Skoru: ${matchScoreP1} - ${matchScoreP2}`);
                }
                resetBoard(); 
            }, 500);
        }
    }
}

// -----------------------------------------------------------------
// AKICI VE GELİŞMİŞ ARABA (YARIŞ) OYUNU KODLARI
// -----------------------------------------------------------------
function runCarGame(target) {
    if (!target) return;
    target.innerHTML = ""; 

    // Arayüz ve Kapsayıcılar
    let container = document.createElement('div');
    container.style.position = "relative";
    container.style.width = "320px";
    container.style.margin = "0 auto";

    let uiDiv = document.createElement('div');

    uiDiv.style.justifyContent = "space-between";
    uiDiv.style.color = "#fff";
    uiDiv.style.fontWeight = "bold";
    uiDiv.style.padding = "10px 0";
    uiDiv.innerHTML = `
        <span id="car-dist">Mesafe: 0m</span>
        <span id="car-money">Kasa: 0 💰</span>
    `;
    
    let canvas = document.createElement('canvas');
    canvas.width = 320;
    canvas.height = 480;
    canvas.style.backgroundColor = "#2c3e50";
    canvas.style.border = "4px solid #fff";
    canvas.style.borderRadius = "10px";
    canvas.style.display = "block";
    
    // Başlangıç Ekranı
    let startScreen = document.createElement('div');
    startScreen.style.position = "absolute";
    startScreen.style.top = "0";
    startScreen.style.left = "0";
    startScreen.style.width = "100%";
    startScreen.style.height = "100%";
    startScreen.style.backgroundColor = "rgba(0,0,0,0.8)";
    startScreen.style.display = "flex";
    startScreen.style.flexDirection = "column";
    startScreen.style.alignItems = "center";
    startScreen.style.justifyContent = "center";
    startScreen.style.color = "#fff";
    startScreen.style.borderRadius = "10px";

    let startBtn = document.createElement('button');
    startBtn.innerText = "🏎️ Oyuna Başla";
    startBtn.className = "btn";
    startBtn.style.padding = "15px 30px";
    startBtn.style.fontSize = "1.2rem";

    let gameOverText = document.createElement('h2');
    gameOverText.style.display = "none";
    gameOverText.style.color = "#e74c3c";
    gameOverText.style.textAlign = "center";
    gameOverText.style.marginBottom = "20px";

    startScreen.appendChild(gameOverText);
    startScreen.appendChild(startBtn);
    
    container.appendChild(uiDiv);
    container.appendChild(canvas);
    container.appendChild(startScreen);
    target.appendChild(container);

    let ctx = canvas.getContext('2d');

    // Oyun Değişkenleri
    let isGameRunning = false;
    let animationId;
    let keys = {};

    let speed = 4;
    let distance = 0;
    let money = 0;
    let frames = 0;

    let player = { x: 140, y: 380, w: 40, h: 70, vx: 0, maxSpeed: 6 };
    let enemies = [];
    let roadLines = [0, 160, 320, 480]; // Şerit çizgilerinin Y pozisyonları
    let floatingTexts = [];

    // Çarpışma Kontrolü (AABB)
    function isColliding(r1, r2) {
        // Araçların tam kenarlarından çarpmaması için çarpışma kutusunu (hitbox) biraz küçültüyoruz
        let p = { x: r1.x + 5, y: r1.y + 5, w: r1.w - 10, h: r1.h - 10 };
        let e = { x: r2.x + 5, y: r2.y + 5, w: r2.w - 10, h: r2.h - 10 };
        return !(p.x > e.x + e.w || p.x + p.w < e.x || p.y > e.y + e.h || p.y + p.h < e.y);
    }

    // Makas (Teğet Geçme) Kontrolü
    function isNearMiss(p_rect, e_rect) {
        // Oyuncunun etrafındaki "tehlike" alanı (Çok yakınından geçerse algılar)
        let aura = { x: p_rect.x - 20, y: p_rect.y - 10, w: p_rect.w + 40, h: p_rect.h + 20 };
        let e = { x: e_rect.x, y: e_rect.y, w: e_rect.w, h: e_rect.h };
        return !(aura.x > e.x + e.w || aura.x + aura.w < e.x || aura.y > e.y + e.h || aura.y + aura.h < e.y);
    }

    // Düşman Arabası Üret (Artık Rastgele Koordinatlarda Çıkabilir, Sadece Şeritte Değil)
    function spawnEnemy() {
        let spawnRate = Math.max(30, 90 - Math.floor(speed * 5)); // Hızlandıkça daha sık gelir
        if (frames % spawnRate === 0) {
            let eWidth = 40;
            // Arabaların tamamen rastgele x koordinatında çıkmasını sağlıyoruz (iç içe geçebilirler, arasından geçmek zevkli olur)
            let randomX = Math.random() * (canvas.width - eWidth);
            let colors = ["#e74c3c", "#9b59b6", "#f1c40f", "#e67e22", "#1abc9c"];
            let eColor = colors[Math.floor(Math.random() * colors.length)];
            
            enemies.push({ x: randomX, y: -80, w: eWidth, h: 70, color: eColor, nearMissed: false });
        }
    }

    function resetGame() {
        speed = 4;
        distance = 0;
        money = 0;
        frames = 0;
        player.x = canvas.width / 2 - player.w / 2;
        enemies = [];
        floatingTexts = [];
        updateUI();
    }

    function updateUI() {
        document.getElementById('car-dist').innerText = `Mesafe: ${Math.floor(distance)}m`;
        document.getElementById('car-money').innerText = `Kasa: ${money} 💰`;
    }

    // Arabayı (Yumuşak Köşeli Dikdörtgen) Çizme Fonksiyonu
    function drawCar(x, y, w, h, color) {
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.roundRect(x, y, w, h, 8); // Yumuşak köşeler
        ctx.fill();

        // Camlar
        ctx.fillStyle = "#34495e";
        ctx.fillRect(x + 5, y + 10, w - 10, 15); // Ön cam
        ctx.fillRect(x + 5, y + h - 20, w - 10, 10); // Arka cam
        
        // Farlar
        if (color === "#3498db") { // Bizim arabaysa kırmızı stop lambaları
            ctx.fillStyle = "red";
            ctx.fillRect(x + 5, y + h - 5, 8, 5);
            ctx.fillRect(x + w - 13, y + h - 5, 8, 5);
        } else { // Düşmansa sarı ön farlar
            ctx.fillStyle = "yellow";
            ctx.fillRect(x + 5, y, 8, 5);
            ctx.fillRect(x + w - 13, y, 8, 5);
        }
    }

    function gameLoop() {
        if (!isGameRunning) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        frames++;
        distance += speed / 10;
        
        // Zamanla oyun hızlansın (Max hız sınırı: 15)
        if (frames % 60 === 0 && speed < 15) {
            speed += 0.15;
        }

        // --- YOL ÇİZİMİ ---
        for (let i = 0; i < roadLines.length; i++) {
            roadLines[i] += speed;
            if (roadLines[i] >= canvas.height) roadLines[i] -= canvas.height + 160;
            
            ctx.fillStyle = "rgba(255, 255, 255, 0.5)";
            // Sol şerit çizgisi
            ctx.fillRect(canvas.width / 3 - 2, roadLines[i], 4, 80);
            // Sağ şerit çizgisi
            ctx.fillRect((canvas.width / 3) * 2 - 2, roadLines[i], 4, 80);
        }

        // --- OYUNCU HAREKETİ (AKICI) ---
        if ((keys["ArrowLeft"] || keys["a"]) && player.x > 0) {
            player.x -= player.maxSpeed;
        }
        if ((keys["ArrowRight"] || keys["d"]) && player.x < canvas.width - player.w) {
            player.x += player.maxSpeed;
        }

        // --- DÜŞMANLAR VE ÇARPIŞMA / MAKAS ---
        spawnEnemy();
        for (let i = enemies.length - 1; i >= 0; i--) {
            let e = enemies[i];
            e.y += speed * 0.8; // Düşmanlar bizden biraz daha yavaş gidiyor gibi (Yol 1x kayarken onlar 0.8x)

            // Makas (Teğet Geçme) Atıldı mı?
            if (!e.nearMissed && e.y > player.y - e.h && e.y < player.y + player.h) {
                if (isNearMiss(player, e) && !isColliding(player, e)) {
                    e.nearMissed = true; // Sadece 1 kere puan versin
                    money += 10;
                    floatingTexts.push({ x: player.x, y: player.y - 20, text: "+10 💰", life: 40 });
                    updateUI();
                }
            }

            // Çarpışma (Oyun Bitti)
            if (isColliding(player, e)) {
                isGameRunning = false;
                startScreen.style.display = "flex";
                gameOverText.style.display = "block";
                gameOverText.innerHTML = `💥 Kaza Yaptın!<br>Gidilen Mesafe: <span style="color:#2ecc71">${Math.floor(distance)}m</span><br>Kazanılan: <span style="color:#f1c40f">${money} 💰</span>`;
                startBtn.innerText = "🔄 Tekrar Oyna";
                
                // Eğer global skor kayıt sistemin varsa, kazanılan parayı skora ekleyebilirsin:
                if (typeof saveNewScore === "function") saveNewScore(money); 
            }

            // Ekrandan çıkanları sil
            if (e.y > canvas.height) enemies.splice(i, 1);
            else drawCar(e.x, e.y, e.w, e.h, e.color); // Düşmanı Çiz
        }

        // --- OYUNCUYU ÇİZ ---
        drawCar(player.x, player.y, player.w, player.h, "#3498db"); 

        // --- YAZI EFEKTLERİ (Makas atınca çıkan para yazısı) ---
        for (let i = floatingTexts.length - 1; i >= 0; i--) {
            let ft = floatingTexts[i];
            ft.y -= 2; // Yazı yukarı doğru süzülür
            ft.life--;
            ctx.globalAlpha = ft.life / 40; // Yavaşça kaybolur
            ctx.fillStyle = "#f1c40f";
            ctx.font = "bold 20px Arial";
            ctx.fillText(ft.text, ft.x - 10, ft.y);
            ctx.globalAlpha = 1.0;
            if (ft.life <= 0) floatingTexts.splice(i, 1);
        }

        if (frames % 10 === 0) updateUI(); // Her 10 karede bir mesafeyi güncelle
        animationId = requestAnimationFrame(gameLoop);
    }

    // --- KONTROLLER ---
    window.addEventListener("keydown", (e) => { keys[e.key] = true; });
    window.addEventListener("keyup", (e) => { keys[e.key] = false; });

    // Mobil Butonları Araba İçin Akıcı Kontrole Çevirme (HTML'de m-left ve m-right id'li butonların varsa çalışır)
    function bindMobileBtn(id, key) {
        let btn = document.getElementById(id);
        if (!btn) return;
        const press = (e) => { e.preventDefault(); keys[key] = true; };
        const release = (e) => { e.preventDefault(); keys[key] = false; };
        
        btn.onmousedown = press; btn.ontouchstart = press;
        btn.onmouseup = release; btn.ontouchend = release; 
        btn.onmouseleave = release; 
    }
    bindMobileBtn('m-left', 'ArrowLeft');
    bindMobileBtn('m-right', 'ArrowRight');

    // Başlatma Butonu
    startBtn.onclick = () => {
        startScreen.style.display = "none";
        isGameRunning = true;
        resetGame();
        if (animationId) cancelAnimationFrame(animationId);
        gameLoop();
    };
}

// -----------------------------------------------------------------
// 6. GELİŞMİŞ VE AKICI LABİRENT (MAZE) OYUNU KODLARI
// -----------------------------------------------------------------
function runMazeGame(target) {
    if (!target) return;
    
    target.innerHTML = ""; 

    let startContainer = document.createElement('div');
    startContainer.style.textAlign = "center";
    startContainer.style.marginTop = "30px";

    let startBtn = document.createElement('button');
    startBtn.innerText = "🧭 Labirente Başla";
    startBtn.className = "btn";
    startBtn.style.padding = "15px 40px";
    startBtn.style.fontSize = "1.5rem";

    startContainer.appendChild(startBtn);
    target.appendChild(startContainer);

    let infoDiv = document.createElement('div');
    infoDiv.style.display = "none";
    infoDiv.style.justifyContent = "space-between";
    infoDiv.style.width = "360px";
    infoDiv.style.margin = "0 auto 10px auto";
    infoDiv.style.fontWeight = "bold";
    infoDiv.style.color = "#fff";
    infoDiv.innerHTML = `<span id="maze-level">Seviye: 1</span><span id="maze-score">Puan: 0</span>`;
    target.appendChild(infoDiv);

    let canvas = document.createElement('canvas');
    canvas.width = 360;
    canvas.height = 360;
    canvas.style.display = "none";
    canvas.style.backgroundColor = "#222";
    canvas.style.border = "4px solid #fff";
    canvas.style.margin = "0 auto";
    target.appendChild(canvas);

    let ctx = canvas.getContext('2d');

    // Oyun Değişkenleri
    let level = 1;
    let score = 0;
    let cols, rows, w;
    let grid = [];
    
    // Akıcı animasyon için hedef ve mevcut pozisyonları ayırıyoruz
    let player = { c: 0, r: 0, targetC: 0, targetR: 0, x: 0, y: 0 };
    let isGameOver = false;
    let animationId;
    let keys = {}; // Basılı tutulan tuşları takip etmek için

    function initLevel() {
        cols = 6 + (level - 1) * 2; 
        if (cols > 36) cols = 36; 
        rows = cols;
        w = canvas.width / cols;

        // Oyuncuyu Başlangıç Noktasına Sıfırla
        player = { c: 0, r: 0, targetC: 0, targetR: 0, x: 0, y: 0 };
        keys = {}; 
        isGameOver = false;

        grid = generateMaze(cols, rows);
        
        let levelEl = document.getElementById('maze-level');
        let scoreEl = document.getElementById('maze-score');
        if (levelEl) levelEl.innerText = `Seviye: ${level}`;
        if (scoreEl) scoreEl.innerText = `Puan: ${score}`;
    }

    function generateMaze(cols, rows) {
        let newGrid = [];
        for (let r = 0; r < rows; r++) {
            for (let c = 0; c < cols; c++) {
                newGrid.push({ c: c, r: r, walls: [true, true, true, true], visited: false });
            }
        }

        function getIndex(c, r) {
            if (c < 0 || r < 0 || c > cols - 1 || r > rows - 1) return -1;
            return c + r * cols;
        }

        let stack = [];
        let current = newGrid[0];
        current.visited = true;
        let unvisitedCount = cols * rows - 1;

        while (unvisitedCount > 0) {
            let neighbors = [];
            let top = newGrid[getIndex(current.c, current.r - 1)];
            let right = newGrid[getIndex(current.c + 1, current.r)];
            let bottom = newGrid[getIndex(current.c, current.r + 1)];
            let left = newGrid[getIndex(current.c - 1, current.r)];

            if (top && !top.visited) neighbors.push({ cell: top, dir: 0 }); 
            if (right && !right.visited) neighbors.push({ cell: right, dir: 1 }); 
            if (bottom && !bottom.visited) neighbors.push({ cell: bottom, dir: 2 }); 
            if (left && !left.visited) neighbors.push({ cell: left, dir: 3 }); 

            if (neighbors.length > 0) {
                let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                stack.push(current);

                if (next.dir === 0) { current.walls[0] = false; next.cell.walls[2] = false; }
                else if (next.dir === 1) { current.walls[1] = false; next.cell.walls[3] = false; }
                else if (next.dir === 2) { current.walls[2] = false; next.cell.walls[0] = false; }
                else if (next.dir === 3) { current.walls[3] = false; next.cell.walls[1] = false; }

                current = next.cell;
                current.visited = true;
                unvisitedCount--;
            } else if (stack.length > 0) {
                current = stack.pop();
            }
        }

        for (let i = 0; i < newGrid.length; i++) {
            let cell = newGrid[i];
            if (Math.random() < 0.08) {
                let wallIndex = Math.floor(Math.random() * 4);
                if (wallIndex === 0 && cell.r > 0) { cell.walls[0] = false; newGrid[getIndex(cell.c, cell.r - 1)].walls[2] = false; }
                if (wallIndex === 1 && cell.c < cols - 1) { cell.walls[1] = false; newGrid[getIndex(cell.c + 1, cell.r)].walls[3] = false; }
                if (wallIndex === 2 && cell.r < rows - 1) { cell.walls[2] = false; newGrid[getIndex(cell.c, cell.r + 1)].walls[0] = false; }
                if (wallIndex === 3 && cell.c > 0) { cell.walls[3] = false; newGrid[getIndex(cell.c - 1, cell.r)].walls[1] = false; }
            }
        }
        return newGrid;
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Labirenti Çiz
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;
        ctx.lineCap = "round";

        for (let i = 0; i < grid.length; i++) {
            let cell = grid[i];
            let x = cell.c * w;
            let y = cell.r * w;

            ctx.beginPath();
            if (cell.walls[0]) { ctx.moveTo(x, y); ctx.lineTo(x + w, y); } 
            if (cell.walls[1]) { ctx.moveTo(x + w, y); ctx.lineTo(x + w, y + w); } 
            if (cell.walls[2]) { ctx.moveTo(x + w, y + w); ctx.lineTo(x, y + w); } 
            if (cell.walls[3]) { ctx.moveTo(x, y + w); ctx.lineTo(x, y); } 
            ctx.stroke();
        }

        // Çıkışı Çiz
        ctx.fillStyle = "#2ecc71";
        ctx.fillRect((cols - 1) * w + 2, (rows - 1) * w + 2, w - 4, w - 4);

        // Oyuncuyu Çiz (Kayan Koordinatları Kullanarak)
        ctx.fillStyle = "#e94560";
        ctx.beginPath();
        ctx.arc(player.x + w / 2, player.y + w / 2, w / 2.5, 0, Math.PI * 2);
        ctx.fill();
    }

    // 60 FPS Oyun Döngüsü
    function gameLoop() {
        if (!isGameOver) {
            // Animasyon Hızı (Kare başına katedilecek mesafe)
            let moveSpeed = w / 4; 
            
            let targetPixelX = player.targetC * w;
            let targetPixelY = player.targetR * w;
            
            let dx = targetPixelX - player.x;
            let dy = targetPixelY - player.y;

            // Eğer hedefe tam ulaşılmadıysa, kaymaya devam et
            if (Math.abs(dx) > 0.1 || Math.abs(dy) > 0.1) {
                if (Math.abs(dx) > moveSpeed) player.x += Math.sign(dx) * moveSpeed;
                else player.x = targetPixelX;

                if (Math.abs(dy) > moveSpeed) player.y += Math.sign(dy) * moveSpeed;
                else player.y = targetPixelY;
            } else {
                // Hedef hücreye varıldı, koordinatları sabitle
                player.c = player.targetC;
                player.r = player.targetR;
                player.x = targetPixelX;
                player.y = targetPixelY;

                // Kazanma kontrolü
                if (player.c === cols - 1 && player.r === rows - 1) {
                    isGameOver = true;
                    score += level * 20; 
                    
                    let globalScoreEl = document.getElementById('current-score');
                    if (globalScoreEl) globalScoreEl.innerText = score;
                    if (typeof saveNewScore === "function") saveNewScore(score); 
                    
                    level++;
                    setTimeout(() => { initLevel(); }, 300);
                }

                // Hedefe varıldıysa ve basılı tutulan bir yön tuşu varsa yeni hedefe geç
                if (!isGameOver) {
                    let currentCell = grid[player.c + player.r * cols];
                    if ((keys["ArrowUp"] || keys["w"]) && !currentCell.walls[0]) player.targetR--;
                    else if ((keys["ArrowRight"] || keys["d"]) && !currentCell.walls[1]) player.targetC++;
                    else if ((keys["ArrowDown"] || keys["s"]) && !currentCell.walls[2]) player.targetR++;
                    else if ((keys["ArrowLeft"] || keys["a"]) && !currentCell.walls[3]) player.targetC--;
                }
            }
        }
        
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    startBtn.onclick = () => {
        startContainer.style.display = "none";
        infoDiv.style.display = "flex";
        canvas.style.display = "block";

        if (animationId) cancelAnimationFrame(animationId);
        
        initLevel();
        gameLoop(); // Motoru başlat

        // Klavye Kontrolleri (Basılı tutma)
        window.onkeydown = (e) => { 
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.key)) e.preventDefault();
            keys[e.key] = true; 
        };
        window.onkeyup = (e) => { keys[e.key] = false; };

        // Mobil Butonları Akıcı Kontrole Çevirme
        function bindMobileBtn(id, key) {
            let btn = document.getElementById(id);
            if (!btn) return;
            const press = (e) => { e.preventDefault(); keys[key] = true; };
            const release = (e) => { e.preventDefault(); keys[key] = false; };
            
            btn.onmousedown = press; btn.ontouchstart = press;
            btn.onmouseup = release; btn.ontouchend = release; 
            btn.onmouseleave = release; // Butondan parmak kayarsa hareketi durdur
        }

        bindMobileBtn('m-up', 'ArrowUp');
        bindMobileBtn('m-right', 'ArrowRight');
        bindMobileBtn('m-down', 'ArrowDown');
        bindMobileBtn('m-left', 'ArrowLeft');
    };
}

    </script>
